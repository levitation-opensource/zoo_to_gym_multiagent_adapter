[project]
name = "zoo_to_gym_multiagent_adapter"
version = "0.9.3.1"
description = "Zoo to Gym Multi-Agent Adapter"
readme = "README.md"
authors = [
  {name = "Roland Pihlakas", email = "roland@simplify.ee"}
]
dependencies = [
  "gymnasium==0.29.1",
  "PettingZoo==1.24.1",
  "psutil==5.9.4",
  "torch==2.1.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zoo_to_gym_multiagent_adapter"]

[tool.black]
line-length = 88
force-exclude = '''
/(
gymnasium
| pettingzoo
| \.vshistory
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = "E121,E123,E126,E226,E24,E704,W503,W504,E203,E501,F401,W291,E266,F403,F405,F841,E265,F811"

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
ignore_missing_imports = true
